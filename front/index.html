<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Innovación Curricular - v2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }

        h1, h2 {
            color: #2c3e50;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 320px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }

            button:hover {
                background-color: #219150;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        .alert {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .alert-error {
            background-color: #e74c3c;
            color: white;
        }

        .alert-success {
            background-color: #2ecc71;
            color: white;
        }

        .badge {
            background: #3498db;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

    <h1>Gestión de Estructura Académica (v2)</h1>

    <div id="alertBox" class="alert"></div>

    <div class="container">
        <!-- FORMULARIO CREAR FACULTAD (Criterio 5: Select con FK) -->
        <div class="card">
            <h2>Crear Facultad</h2>
            <form id="formFacultad">
                <div class="form-group">
                    <label for="nombreFacultad">Nombre de la Facultad</label>
                    <input type="text" id="nombreFacultad" placeholder="Ej: Facultad de Ingeniería" required>
                </div>
                <div class="form-group">
                    <label for="selectUniversidad">Universidad (Maestro)</label>
                    <select id="selectUniversidad" required>
                        <option value="">-- Cargando universidades... --</option>
                    </select>
                </div>
                <button type="submit">Guardar Facultad</button>
            </form>
        </div>

        <!-- FORMULARIO CREAR PROGRAMA -->
        <div class="card">
            <h2>Crear Programa Académico</h2>
            <form id="formPrograma">
                <div class="form-group">
                    <label for="nombrePrograma">Nombre del Programa</label>
                    <input type="text" id="nombrePrograma" placeholder="Ej: Ingeniería de Software" required>
                </div>
                <div class="form-group">
                    <label for="selectFacultad">Facultad Perteneciente</label>
                    <select id="selectFacultad" required>
                        <option value="">-- Cargando facultades... --</option>
                    </select>
                </div>
                <button type="submit">Guardar Programa</button>
            </form>
        </div>
    </div>

    <!-- TABLA MAESTRO - DETALLE (Criterio 9) -->
    <div class="card" style="margin-top: 20px;">
        <h2>Estructura Institucional (Vista Maestro-Detalle)</h2>
        <table id="tablaMaestroDetalle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Facultad (Detalle)</th>
                    <th>Universidad (Maestro)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Contenido cargado vía JS -->
            </tbody>
        </table>
    </div>

    <script>
                const API_BASE = "http://localhost:5000/api";

                function mostrarAlerta(mensaje, esError = false) {
                    const box = document.getElementById("alertBox");
                    box.className = `alert ${esError ? "alert-error" : "alert-success"}`;
                    box.innerText = mensaje;
                    box.style.display = "block";
                    setTimeout(() => { box.style.display = "none"; }, 5000);
                }

                // 1. CARGAR SELECT DE UNIVERSIDADES (Criterio 5)
                async function cargarUniversidadesSelect() {
                    const select = document.getElementById("selectUniversidad");
                    try {
                        const res = await fetch(`${API_BASE}/universidad`);
                        if (!res.ok) throw new Error("Error al consultar universidades");
                        const universidades = await res.json();

                        select.innerHTML = '<option value="">-- Seleccione una Universidad --</option>';
                        universidades.forEach(u => {
                            const opt = document.createElement("option");
                            opt.value = u.id;
                            opt.textContent = `${u.nombre} (${u.totalFacultades || 0} fac.)`;
                            select.appendChild(opt);
                        });
                    } catch (err) {
                        select.innerHTML = '<option value="">Error cargando opciones</option>';
                    }
                }

                // 2. CARGAR SELECT DE FACULTADES
                async function cargarFacultadesSelect() {
                    const select = document.getElementById("selectFacultad");
                    try {
                        const res = await fetch(`${API_BASE}/facultad`);
                        if (!res.ok) throw new Error("Error al consultar facultades");
                        const facultades = await res.json();

                        select.innerHTML = '<option value="">-- Seleccione una Facultad --</option>';
                        facultades.forEach(f => {
                            const opt = document.createElement("option");
                            opt.value = f.id;
                            opt.textContent = `${f.nombre} - ${f.universidadNombre}`;
                            select.appendChild(opt);
                        });
                    } catch (err) {
                        select.innerHTML = '<option value="">Error cargando opciones</option>';
                    }
                }

                // 3. CARGAR TABLA MAESTRO-DETALLE DE FACULTADES
                async function cargarTablaFacultades() {
                    const tbody = document.querySelector("#tablaMaestroDetalle tbody");
                    try {
                        const res = await fetch(`${API_BASE}/facultad`);
                        const facultades = await res.json();

                        tbody.innerHTML = "";
                        facultades.forEach(f => {
                            const tr = document.createElement("tr");
                            tr.innerHTML = `
                                <td>${f.id}</td>
                                <td><strong>${f.nombre}</strong></td>
                                <td><span class="badge">${f.universidadNombre}</span></td>
                                <td>
                                    <button style="background-color: #e74c3c; width: auto; padding: 5px 10px;" onclick="eliminarFacultad(${f.id})">Retirar</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } catch (err) {
                        tbody.innerHTML = '<tr><td colspan="4">Error al cargar listado.</td></tr>';
                    }
                }

                // 4. GUARDAR FACULTAD CON MANEJO DE ERROR 409
                document.getElementById("formFacultad").addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const body = {
                        nombre: document.getElementById("nombreFacultad").value,
                        universidadId: parseInt(document.getElementById("selectUniversidad").value)
                    };

                    const res = await fetch(`${API_BASE}/facultad`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });

                    if (res.status === 409) {
                        const err = await res.json();
                        mostrarAlerta(`[Error 409]: ${err.mensaje}`, true);
                    } else if (res.ok) {
                        mostrarAlerta("Facultad registrada con éxito.");
                        document.getElementById("formFacultad").reset();
                        cargarTablaFacultades();
                        cargarFacultadesSelect();
                        cargarUniversidadesSelect(); // Actualiza contador del trigger
                    } else {
                        mostrarAlerta("Ocurrió un error inesperado al guardar.", true);
                    }
                });

                // 5. BORRADO LÓGICO DE FACULTAD
                async function eliminarFacultad(id) {
                    if (!confirm("¿Desea retirar esta facultad?")) return;
                    const res = await fetch(`${API_BASE}/facultad/${id}`, { method: "DELETE" });
                    if (res.ok) {
                        mostrarAlerta("Facultad retirada (borrado lógico aplicado).");
                        cargarTablaFacultades();
                        cargarFacultadesSelect();
                        cargarUniversidadesSelect();
                    }
                }

                // INICIALIZACIÓN
                window.addEventListener("DOMContentLoaded", () => {
                    cargarUniversidadesSelect();
                    cargarFacultadesSelect();
                    cargarTablaFacultades();
                });
    </script>
</body>
</html>
